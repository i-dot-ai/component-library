<a data-if="href" href role="button" class="govuk-button" data-variant:secondary="govuk-button--secondary"
    data-variant:warning="govuk-button--warning" data-variant:inverse="govuk-button--inverse" data-rest>
    <slot></slot>
</a>
<button data-else class="govuk-button" data-module="govuk-button" data-variant:secondary="govuk-button--secondary"
    data-variant:warning="govuk-button--warning" data-variant:inverse="govuk-button--inverse" data-rest>
    <slot></slot>
</button>
