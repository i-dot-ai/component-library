name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Upgrade npm for trusted publishing
        run: |
          # Node 22 bundles an npm older than the 11.5.1 OIDC floor.
          npm install -g npm@11.5.1
          npm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          name="@i-dot-ai-npm/component-library-react"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate packages
        if: steps.check.outputs.publish == 'true'
        run: pnpm run generate

      - name: Debug auth (temporary)
        if: steps.check.outputs.publish == 'true'
        run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"   # 0 = secret not reaching this step
          npm whoami || echo "npm whoami failed (anonymous or bad/wrong-scope token)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish all packages
        if: steps.check.outputs.publish == 'true'
        run: |
          version="${{ steps.check.outputs.version }}"
          for fw in react solid svelte astro; do
            name="@i-dot-ai-npm/component-library-$fw"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already published — skipping."
              continue
            fi
            # Publish with the npm CLI, as pnpm publish does not support OIDC.
            ( cd "packages/$fw" && npm publish --access public )
          done
